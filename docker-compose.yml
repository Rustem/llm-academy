version: "3.8"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./llm_academy.db
      - SECRET_KEY=${SECRET_KEY:-change-me-to-a-random-string}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - CORS_ORIGINS=http://localhost:5173,http://localhost:3000
    volumes:
      - backend-data:/app/data

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  backend-data:
